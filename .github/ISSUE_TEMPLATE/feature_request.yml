name: "💡 Feature Request"
description: "Suggest an idea or enhancement for dotXPANDER."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! dotXPANDER is designed for ultra-low latency, zero memory leaks, and minimalist ergonomics.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: Is your feature request related to a problem or limitation? Explain the context.
      placeholder: "I find myself wanting to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Desired Behavior
      description: Describe how you envision this feature or capability working in dotXPANDER.
      placeholder: "Add an option to..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative workflows, tools, or designs you've considered.
      placeholder: "A clear and concise description of any alternatives..."
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context & Mockups
      description: Add any UI mockups, reference links, or screenshots here.
    validations:
      required: false
